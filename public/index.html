<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the Wheel</title>
<style>
/* ── THEME TOKENS ─────────────────────────────────── */
:root,
[data-theme="dark"] {
  --bg:#0C0C1A; --surf:#14142A; --surf2:#1C1C36;
  --bdr:rgba(255,255,255,.07); --txt:#F5F5FF;
  --muted:rgba(255,255,255,.36); --acc:#FFB800;
  --acc-d:rgba(255,184,0,.13); --red:#FF5656;
  --modal-bg:rgba(0,0,0,.82);
}
[data-theme="light"] {
  --bg:#F4F3FA; --surf:#FFFFFF; --surf2:#EDEBF6;
  --bdr:rgba(0,0,0,.09); --txt:#18182E;
  --muted:rgba(0,0,0,.42); --acc:#B07B00;
  --acc-d:rgba(176,123,0,.12); --red:#C83030;
  --modal-bg:rgba(0,0,0,.55);
}

/* ── RESET ────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:auto}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:14px;background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;overflow:auto;
  transition:background .25s,color .25s;
}

/* ── HEADER ───────────────────────────────────────── */
.hdr{
  flex-shrink:0;height:52px;
  display:flex;align-items:center;gap:10px;padding:0 20px;
  background:var(--surf);border-bottom:1px solid var(--bdr);
  z-index:10;transition:background .25s;
}
.hdr-ico{
  width:26px;height:26px;background:var(--acc);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;transition:background .25s;
}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--txt)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:9px}
.badge{
  font-size:11px;color:var(--muted);background:var(--surf2);
  border:1px solid var(--bdr);padding:3px 9px;border-radius:20px;
  transition:background .25s;
}
.theme-btn{
  background:var(--surf2);border:1px solid var(--bdr);color:var(--txt);
  border-radius:7px;padding:5px 10px;font-size:15px;line-height:1;
  cursor:pointer;transition:background .15s;
}
.theme-btn:hover{background:var(--bdr)}

/* ── LAYOUT ── always stacked: wheel on top, panel below ── */
.main{flex:1;display:flex;flex-direction:column;overflow:visible}

/* ── WHEEL SIDE ───────────────────────────────────── */
.wside{
  width:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  gap:16px;padding:18px 14px 14px;
  border-bottom:1px solid var(--bdr);
  transition:border-color .25s;
}
.spin-btn{
  background:var(--acc);color:#0B0B18;border:none;
  padding:16px 64px;font-size:17px;font-weight:800;
  letter-spacing:1.8px;text-transform:uppercase;
  border-radius:50px;cursor:pointer;
  box-shadow:0 4px 20px rgba(255,184,0,.3);
  transition:transform .12s,box-shadow .12s;
}
.spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 26px rgba(255,184,0,.46)}
.spin-btn:active:not(:disabled){transform:translateY(0)}
.spin-btn:disabled{opacity:.4;cursor:not-allowed}
.clabel{font-size:12px;color:var(--muted);text-align:center}

/* ── PANEL SIDE (below wheel) ─────────────────────── */
.pside{
  flex:none;min-width:0;
  display:flex;flex-direction:column;overflow:visible;
}

/* PRESETS */
.pbar{
  flex-shrink:0;display:flex;gap:7px;align-items:center;
  padding:10px 14px;background:var(--surf);
  border-bottom:1px solid var(--bdr);transition:background .25s;
}
.pselect{
  flex:1;min-width:0;background:var(--surf2);
  border:1px solid var(--bdr);border-radius:8px;
  color:var(--txt);font:13px inherit;padding:7px 9px;outline:none;
}
.pselect:focus{border-color:var(--acc)}

/* TABS */
.tabs{
  flex-shrink:0;display:flex;
  background:var(--surf);border-bottom:1px solid var(--bdr);
  padding:0 14px;transition:background .25s;
}
.tab{
  height:44px;padding:0 14px;font-size:12.5px;font-weight:600;
  color:var(--muted);border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab:hover:not(.on){color:var(--txt)}

/* ADD AREA */
.add-area{flex-shrink:0;padding:12px 14px;border-bottom:1px solid var(--bdr)}
.pane{display:none;flex-direction:column;gap:8px}
.pane.on{display:flex}
.row{display:flex;gap:7px}

.field,.ta{
  flex:1;width:100%;background:var(--surf2);
  border:1px solid var(--bdr);border-radius:8px;
  color:var(--txt);font:13.5px/1.5 inherit;
  padding:8px 11px;outline:none;
  transition:border-color .15s,background .25s;
}
.field::placeholder,.ta::placeholder{color:var(--muted)}
.field:focus,.ta:focus{border-color:var(--acc)}
.ta{resize:none;height:90px}
.hint{font-size:10.5px;color:var(--muted);line-height:1.5}

.abtn{
  flex-shrink:0;background:var(--acc-d);color:var(--acc);
  border:1px solid rgba(255,184,0,.2);border-radius:8px;
  padding:8px 13px;font:600 12.5px/1 inherit;
  cursor:pointer;white-space:nowrap;transition:background .15s;
}
.abtn:hover{background:rgba(255,184,0,.22)}
.abtn.fw{width:100%;padding:10px;text-align:center}

/* LIST */
.larea{flex:none;overflow:visible;padding:0 14px 24px}
.lhdr{
  position:static;background:var(--bg);z-index:2;
  padding:9px 0 6px;display:flex;align-items:center;
  justify-content:space-between;transition:background .25s;
}
.ltitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.dngr{
  background:none;border:none;color:rgba(200,50,50,.5);
  font:600 11px/1 inherit;cursor:pointer;
  padding:3px 7px;border-radius:5px;transition:color .15s,background .15s;
}
.dngr:hover{color:var(--red);background:rgba(200,50,50,.1)}

.ilist{display:flex;flex-direction:column;gap:5px}
.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:13px}
.empty em{display:block;font-size:28px;margin-bottom:8px;font-style:normal}

.irow{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 10px;background:var(--surf);
  border:1px solid var(--bdr);border-radius:8px;
  transition:background .12s;
}
.irow:hover{background:var(--surf2)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.inum{font-size:10.5px;color:var(--muted);flex-shrink:0;min-width:15px;margin-top:1px;font-variant-numeric:tabular-nums}
.itxt{flex:1;font-size:13px;line-height:1.45;word-break:break-word;color:var(--txt)}
.xbtn{
  flex-shrink:0;background:none;border:none;
  color:rgba(128,128,128,.4);font-size:17px;line-height:1;
  cursor:pointer;padding:1px 5px;border-radius:4px;
  transition:color .12s,background .12s;
}
.xbtn:hover{color:var(--red);background:rgba(200,50,50,.1)}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.18);border-radius:2px}

/* ── WINNER MODAL ─────────────────────────────────── */
.ov{
  display:none;position:fixed;inset:0;
  background:var(--modal-bg);z-index:999;
  align-items:center;justify-content:center;
}
.ov.on{display:flex}
.mcard{
  background:var(--surf);border:1.5px solid var(--acc);
  border-radius:18px;padding:36px 48px;text-align:center;
  max-width:92vw;max-height:90vh;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.3);
  animation:pop .28s cubic-bezier(.34,1.56,.64,1);
  transition:background .25s;
}
@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.mey{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--acc);margin-bottom:10px}
.mwin{font-size:clamp(28px,5vw,64px);font-weight:700;line-height:1.25;margin-bottom:28px;max-width:1000px;color:var(--txt);overflow-wrap:anywhere;white-space:pre-wrap}
.macts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.mb{padding:10px 22px;border-radius:50px;font:700 13px/1 inherit;cursor:pointer;border:none;transition:transform .1s,box-shadow .1s}
.mb-p{background:var(--acc);color:#0B0B18;box-shadow:0 4px 12px rgba(255,184,0,.25)}
.mb-p:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,184,0,.4)}
.mb-s{background:var(--surf2);color:var(--muted);border:1px solid var(--bdr)}
.mb-s:hover{color:var(--txt)}

/* ── KIOSK MODE — wheel + spin button only, fills the screen ── */
body.kiosk{height:100vh;overflow:hidden}
body.kiosk .hdr{display:none}
body.kiosk .pside{display:none}
body.kiosk .clabel{display:none}
body.kiosk .main{height:100vh}
body.kiosk .wside{flex:1;justify-content:center;border-bottom:none}
/* Touch controls and import preview */
button,select{min-height:44px;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
.pbar{flex-wrap:wrap}
.pselect{flex-basis:180px}
.display-exit{display:none;position:fixed;top:12px;right:12px;z-index:1000;
  padding:10px 18px;border:1px solid var(--bdr);border-radius:12px;
  background:var(--surf);color:var(--txt);font:600 14px system-ui;cursor:pointer}
body.kiosk .display-exit{display:block}
body.kiosk .wside{padding-top:64px}
body.kiosk .spin-btn{font-size:clamp(22px,3vw,36px);padding:18px 70px}
.import-card{width:600px;text-align:left;padding:28px}
.import-card h2{margin-bottom:12px;font-size:24px}
.import-card p{margin-bottom:14px;line-height:1.6}
.import-preview{max-height:35vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;
  background:var(--surf2);padding:14px;border-radius:8px;margin-bottom:18px}
.import-status{padding:0 14px;color:var(--txt);line-height:1.5}
.import-status:empty{display:none}
@media(max-width:480px){.mcard{padding:24px 18px}.pbar{gap:6px}}
</style>
</head>
<body>
<button class="display-exit" id="displayExit">← Setup</button>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-ico">🎡</div>
  <h1>Spin the Wheel</h1>
  <div class="hdr-r">
    <div class="badge" id="badge">0 items</div>
    <button class="theme-btn" id="kioskBtn" title="Enter display mode" aria-label="Enter display mode">⛶</button>
    <button class="theme-btn" id="themeBtn" title="Toggle theme">☀️</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- WHEEL -->
  <div class="wside">
    <canvas id="wc" role="img" aria-label="Wheel of phrases"></canvas>
    <button class="spin-btn" id="spinBtn">SPIN</button>
    <div class="clabel" id="clabel">Add items below to begin</div>
  </div>

  <!-- PANEL -->
  <div class="pside">
    <div class="pbar">
      <select class="pselect" id="presetSel">
        <option value="">Load preset…</option>
      </select>
      <button class="abtn" id="presetSaveBtn" title="Save current wheel as a preset">💾 Save</button>
      <button class="theme-btn" id="presetExportBtn" title="Export all presets to a file">⬇</button>
      <button class="theme-btn" id="presetImportBtn" title="Import presets from a file">⬆</button>
      <button class="dngr" id="presetDelBtn" title="Delete selected preset">🗑</button>
      <input type="file" id="presetFile" accept=".json,application/json" style="display:none">
    </div>
    <p class="import-status" id="importStatus" role="status" aria-live="polite"></p>
    <div class="tabs">
      <button class="tab on" id="tA">Add One</button>
      <button class="tab" id="tB">Bulk Add</button>
    </div>
    <div class="add-area">
      <div class="pane on" id="pA">
        <div class="row">
          <input type="text" class="field" id="sin" placeholder="Type a sentence or phrase…">
          <button class="abtn" id="addOne">+ Add</button>
        </div>
        <div class="hint">Press Enter to add quickly</div>
      </div>
      <div class="pane" id="pB">
        <textarea class="ta" id="bin" placeholder="Paste items here — one per line:&#10;&#10;Tell us about your weekend&#10;Ask someone about their dream job&#10;Share a surprising fact about yourself"></textarea>
        <div class="hint">One item per line · Empty lines are skipped</div>
        <button class="abtn fw" id="addBulk">+ Add All to Wheel</button>
      </div>
    </div>
    <div class="larea">
      <div class="lhdr">
        <span class="ltitle">On the Wheel</span>
        <button class="dngr" id="clearAll">Clear All</button>
      </div>
      <div class="ilist" id="ilist"></div>
    </div>
  </div>
</div>

<!-- WINNER MODAL -->
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mwin">
  <div class="mcard">
    <div class="mey">✨ The Wheel Has Spoken</div>
    <div class="mwin" id="mwin"></div>
    <div class="macts">
      <button class="mb mb-s" id="spinAgainBtn">Spin Again</button>
      <button class="mb mb-p" id="contBtn">Continue →</button>
    </div>
  </div>
</div>

<div class="ov" id="importOv" role="dialog" aria-modal="true" aria-labelledby="importTitle">
  <div class="mcard import-card">
    <h2 id="importTitle">Import phrases</h2>
    <p id="importSummary"></p>
    <div class="import-preview" id="importPreview"></div>
    <p id="importNote"></p>
    <div class="macts">
      <button class="mb mb-s" id="importCancel">Cancel</button>
      <button class="mb mb-s" id="importAppend">Add to wheel</button>
      <button class="mb mb-p" id="importApply">Replace wheel</button>
    </div>
  </div>
</div>
<script>
'use strict';

/* ── PALETTE ─────────────────────────────────────── */
/* Colours chosen so auto luminance check picks correct text colour */
const PAL = [
  '#E63946','#D47820','#2A9D8F','#457B9D',
  '#9B5DE5','#C8429A','#3A86FF','#00956A',
  '#C44200','#B07B00','#0088B4','#7B36C4'
];
const FF = "'Segoe UI',system-ui,sans-serif";

/* ── PERSISTENCE ─────────────────────────────────── */
function loadJSON(key, fb) { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fb; } catch(e) { return fb; } }
function saveJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch(e) {} }

/* ── STATE ───────────────────────────────────────── */
let items = loadJSON('stw-items', []), angle = Math.random() * Math.PI * 2;
let spinning = false, lastWin = -1, aCtx = null;
let presets = Object.assign(Object.create(null), loadJSON('stw-presets', {})), currentPreset = loadJSON('stw-current-preset', '');
let pendingImport = null;

/* ── CANVAS ──────────────────────────────────────── */
const cvs = document.getElementById('wc');
const ctx = cvs.getContext('2d');
let CX, CY, R;

function resizeCvs() {
  /* Internal drawing buffer — always 480×460 */
  cvs.width = 480; cvs.height = 460;
  CX = 215; CY = 230; R = 197;   /* wheel centre + radius in draw-space */

  const kiosk = document.body.classList.contains('kiosk');
  const wside = document.querySelector('.wside');
  const availW = wside.clientWidth - 24;
  /* Kiosk: grow to fill the screen (street display). Normal: shrink to fit only. */
  const scale = kiosk
    ? Math.min(availW / 480, Math.max(1, window.innerHeight - 200) / 460, 3)
    : Math.min(availW / 480, 1);

  cvs.style.width  = Math.round(480 * scale) + 'px';
  cvs.style.height = Math.round(460 * scale) + 'px';
}

/* ── AUDIO ───────────────────────────────────────── */
function ensAudio() {
  if (!aCtx) try { aCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function doTick() {
  if (!aCtx) return;
  try {
    const len = Math.floor(aCtx.sampleRate * .026);
    const b = aCtx.createBuffer(1, len, aCtx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 5);
    const s = aCtx.createBufferSource(); s.buffer = b;
    const g = aCtx.createGain(); g.gain.value = .15;
    s.connect(g); g.connect(aCtx.destination); s.start();
  } catch(e){}
}

/* ── TEXT COLOUR (auto, based on bg luminance) ───── */
function lum(hex) {
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return .2126*r + .7152*g + .0722*b;
}
function txtCol(hex)  { return lum(hex) > 155 ? 'rgba(0,0,0,.85)'    : 'rgba(255,255,255,.95)'; }
function shdwCol(hex) { return lum(hex) > 155 ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.55)'; }

/* ── TEXT FITTING — no ellipsis ──────────────────── */
/* Word-wrap into as many lines as needed so every line fits within maxW.
   ctx.font must already be set to the size being measured. */
function wrapLines(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width <= maxW || !cur) { cur = test; continue; }
    lines.push(cur);
    cur = w;
  }
  if (cur) lines.push(cur);
  /* A single word longer than maxW: hard-split by character so it never crosses the wheel */
  const out = [];
  for (const line of lines) {
    if (ctx.measureText(line).width <= maxW) { out.push(line); continue; }
    let chunk = '';
    for (const ch of line) {
      const test = chunk + ch;
      if (ctx.measureText(test).width > maxW && chunk) { out.push(chunk); chunk = ch; }
      else chunk = test;
    }
    if (chunk) out.push(chunk);
  }
  return out;
}

/* ── DRAW ────────────────────────────────────────── */
function isDark() { return document.documentElement.dataset.theme !== 'light'; }

function draw() {
  const dark = isDark();
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  const n = items.length;

  /* Empty state */
  if (n === 0) {
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI*2);
    ctx.fillStyle = dark ? '#1A1A2E' : '#DDDBE9'; ctx.fill();
    ctx.strokeStyle = dark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.08)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = dark ? 'rgba(255,255,255,.22)' : 'rgba(0,0,0,.3)';
    ctx.font = `14px ${FF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Add items to get started', CX, CY);
    drawPtr(dark); return;
  }

  const arc = (Math.PI*2) / n;
  const maxRW = R - 38;   /* max text width along the radius */

  /* Draw segments */
  for (let i = 0; i < n; i++) {
    const s = angle + i*arc, e = s + arc;
    ctx.beginPath(); ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, s, e); ctx.closePath();
    ctx.fillStyle = PAL[i % PAL.length]; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  /* Draw text on each segment — no ellipsis, auto-size + wrap */
  for (let i = 0; i < n; i++) {
    const mid  = angle + i*arc + arc/2;
    const col  = PAL[i % PAL.length];
    /* available height (perpendicular to radius) at ~65% of radius */
    const perpH = Math.max(8, 2 * R * .65 * Math.sin(arc / 2));
    const maxFs = Math.min(15, perpH * .9);
    const minFs = 7;

    ctx.save();
    ctx.translate(CX, CY); ctx.rotate(mid);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle  = txtCol(col);
    ctx.shadowColor = shdwCol(col); ctx.shadowBlur = 3;

    const text = items[i];

    /* Find the largest font size (down to minFs) whose wrapped lines both
       fit the segment width AND the available height — wraps to as many
       lines as needed instead of ever leaving one long unwrapped line
       that crosses the wheel. */
    let lines = [text], fs = maxFs;
    for (fs = maxFs; fs >= minFs; fs--) {
      ctx.font = `bold ${fs}px ${FF}`;
      const w = wrapLines(text, maxRW);
      if (w.length * (fs * 1.25) <= perpH || fs === minFs) { lines = w; break; }
    }

    ctx.font = `bold ${fs}px ${FF}`;
    const lh = fs * 1.25;
    const top = -((lines.length - 1) * lh) / 2;
    lines.forEach((ln, li) => ctx.fillText(ln, R - 18, top + li * lh));
    ctx.restore();
  }

  /* Outer ring */
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI*2);
  ctx.strokeStyle = dark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.12)';
  ctx.lineWidth = 2; ctx.stroke();

  /* Centre cap */
  ctx.beginPath(); ctx.arc(CX, CY, 18, 0, Math.PI*2);
  ctx.fillStyle = dark ? '#0C0C1A' : '#F4F3FA'; ctx.fill();
  ctx.strokeStyle = dark ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.12)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 6, 0, Math.PI*2);
  ctx.fillStyle = '#FFB800'; ctx.fill();

  drawPtr(dark);
}

/* Pointer drawn on canvas — scales automatically with CSS canvas resize */
function drawPtr(dark) {
  /* Triangle pointing LEFT from the right side of the wheel */
  const tx = CX + R + 4, ty = CY, bx = tx + 25, h = 13;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(bx, ty - h);
  ctx.lineTo(bx, ty + h);
  ctx.closePath();
  ctx.fillStyle = '#FFB800'; ctx.fill();
  ctx.strokeStyle = dark ? 'rgba(255,255,255,.22)' : 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

/* ── WINNER DETECTION ────────────────────────────── */
/* Pointer sits at angle 0 (3-o'clock, rightward) */
function winIdx() {
  const n = items.length, arc = (Math.PI*2) / n;
  const local = ((-angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  return Math.floor(local / arc) % n;
}

/* ── SPIN ────────────────────────────────────────── */
function doSpin() {
  if (spinning || pendingImport || items.length < 2) return;
  ensAudio(); spinning = true;
  updateControls();
  document.getElementById('spinBtn').disabled = true;
  let vel = .18 + Math.random() * .13, lastSeg = -1;
  (function loop() {
    vel *= .9876; angle += vel;
    const n = items.length;
    if (n) {
      const arc = (Math.PI*2) / n;
      const seg = Math.floor((((-angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2)) / arc);
      if (seg !== lastSeg) { doTick(); lastSeg = seg; }
    }
    draw();
    if (vel > .0028) { requestAnimationFrame(loop); }
    else {
      lastWin = winIdx();
      setTimeout(() => { showWin(); spinning = false; updateControls(); }, 260);
    }
  })();
}

/* ── MODAL ───────────────────────────────────────── */
function showWin() {
  document.getElementById('mwin').textContent = items[lastWin];
  document.getElementById('ov').classList.add('on');
  document.getElementById('contBtn').focus();
}
function closeOv() { document.getElementById('ov').classList.remove('on'); }
function spinAgain() {
  closeOv();
  if (items.length >= 2) doSpin();
}

/* ── ITEM MANAGEMENT ─────────────────────────────── */
function addOne() {
  if (spinning) return;
  const el = document.getElementById('sin');
  const v = el.value.trim(); if (!v) return;
  items.push(v); el.value = ''; el.focus(); render(); draw();
}
function addBulk() {
  if (spinning) return;
  const el = document.getElementById('bin');
  const ls = el.value.split('\n').map(l => l.trim()).filter(Boolean);
  if (!ls.length) return;
  items.push(...ls); el.value = ''; render(); draw();
}
function del(i) { if (spinning) return; items.splice(i, 1); render(); draw(); }
function clearAll() {
  if (spinning) return;
  if (!items.length) return;
  if (confirm(`Remove all ${items.length} item${items.length !== 1 ? 's' : ''}?`)) {
    items = []; render(); draw();
  }
}

/* ── PRESETS — named, saved lists you can switch between ── */
function refreshPresetSel() {
  const sel = document.getElementById('presetSel');
  const names = Object.keys(presets).sort((a, b) => a.localeCompare(b));
  sel.innerHTML = '<option value="">Load preset…</option>' +
    names.map(n => `<option value="${esc(n)}"${n === currentPreset ? ' selected' : ''}>${esc(n)}</option>`).join('');
}
function loadPreset(name) {
  if (spinning) return;
  if (!presets[name]) return;
  items = presets[name].slice();
  currentPreset = name;
  saveJSON('stw-current-preset', currentPreset);
  render(); draw();
}
function saveAsPreset() {
  if (spinning) return;
  if (!items.length) { alert('Add items to the wheel before saving a preset.'); return; }
  const name = prompt('Preset name:', currentPreset || '');
  if (!name) return;
  presets[name] = items.slice();
  currentPreset = name;
  saveJSON('stw-presets', presets);
  saveJSON('stw-current-preset', currentPreset);
  refreshPresetSel();
}
function deletePreset() {
  if (spinning) return;
  const name = document.getElementById('presetSel').value;
  if (!name || !presets[name]) return;
  if (!confirm(`Delete preset "${name}"?`)) return;
  delete presets[name];
  if (currentPreset === name) { currentPreset = ''; saveJSON('stw-current-preset', ''); }
  saveJSON('stw-presets', presets);
  refreshPresetSel();
}
function exportPresets() {
  const blob = new Blob([JSON.stringify(presets, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spin-the-wheel-presets.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function validatePhrases(value, label) {
  if (!Array.isArray(value) || !value.length)
    throw new Error(`${label} must be a non-empty array of phrases.`);
  return value.map((phrase, i) => {
    if (typeof phrase !== 'string' || !phrase.trim())
      throw new Error(`${label}: phrase ${i + 1} must be a non-empty string.`);
    return phrase.trim();
  });
}
function parseImport(data) {
  if (Array.isArray(data)) return { phrases: validatePhrases(data, 'The file') };
  if (!data || typeof data !== 'object' || !Object.keys(data).length)
    throw new Error('Use an array of phrases or an object containing named presets.');
  const named = Object.create(null);
  for (const [name, value] of Object.entries(data)) {
    if (!name.trim()) throw new Error('Each preset needs a name.');
    named[name] = validatePhrases(value, `Preset "${name}"`);
  }
  return { named };
}
function importPresets(file) {
  if (spinning) return;
  const status = document.getElementById('importStatus');
  status.textContent = '';
  const reader = new FileReader();
  reader.onerror = () => { status.textContent = 'Could not read the file. Please choose it again.'; };
  reader.onload = () => {
    if (spinning) { status.textContent = 'Wait for the spin to finish, then import again.'; return; }
    try {
      const parsed = parseImport(JSON.parse(reader.result));
      const groups = parsed.named ? Object.entries(parsed.named) : [['Phrases', parsed.phrases]];
      const count = groups.reduce((total, [, phrases]) => total + phrases.length, 0);
      document.getElementById('importSummary').textContent = `${file.name}: ${count} phrases` +
        (parsed.named ? ` across ${groups.length} presets.` : '.');
      document.getElementById('importPreview').textContent = groups.map(([name, phrases]) =>
        `${name} (${phrases.length})\n${phrases.slice(0, 5).join('\n')}${phrases.length > 5 ? '\n…' : ''}`).join('\n\n');
      const conflicts = parsed.named ? Object.keys(parsed.named).filter(name => Object.prototype.hasOwnProperty.call(presets, name)) : [];
      document.getElementById('importNote').textContent = parsed.named
        ? (conflicts.length ? `Existing presets will be replaced: ${conflicts.join(', ')}. The current wheel stays as it is; select a preset after importing.`
          : 'Presets will be saved. Select a preset to load its phrases onto the wheel.')
        : 'Choose whether to replace the current wheel or add these phrases to it.';
      document.getElementById('importAppend').hidden = !!parsed.named;
      document.getElementById('importApply').textContent = parsed.named ? 'Import presets' : 'Replace wheel';
      pendingImport = parsed;
      updateControls();
      document.getElementById('importOv').classList.add('on');
      document.getElementById('importCancel').focus();
    } catch (e) {
      status.textContent = e instanceof SyntaxError ? 'Invalid JSON. Check the file’s commas, brackets, and quotation marks.' : e.message;
    }
  };
  reader.readAsText(file);
}
function closeImport() {
  pendingImport = null;
  document.getElementById('importOv').classList.remove('on');
  updateControls();
  document.getElementById('presetImportBtn').focus();
}
function applyImport(append) {
  if (spinning || !pendingImport) return;
  if (pendingImport.named) {
    Object.assign(presets, pendingImport.named);
    saveJSON('stw-presets', presets);
    refreshPresetSel();
    document.getElementById('importStatus').textContent = 'Presets imported. Select a preset to load the wheel.';
  } else {
    items = append ? items.concat(pendingImport.phrases) : pendingImport.phrases.slice();
    currentPreset = '';
    saveJSON('stw-current-preset', '');
    refreshPresetSel();
    render(); draw();
    document.getElementById('importStatus').textContent = `${items.length} phrases now on the wheel.`;
  }
  closeImport();
}
function updateControls() {
  const locked = spinning || !!pendingImport;
  document.querySelectorAll('.pside button, .pside input, .pside textarea, .pside select').forEach(el => { el.disabled = locked; });
  document.getElementById('spinBtn').disabled = locked || items.length < 2;
}

/* ── RENDER LIST ─────────────────────────────────── */
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function render() {
  saveJSON('stw-items', items);
  document.getElementById('badge').textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;
  document.getElementById('clabel').textContent =
    items.length === 0 ? 'Add items below to begin'
    : items.length === 1 ? '1 item — add at least 2 to spin'
    : `${items.length} items on the wheel`;
  updateControls();
  const list = document.getElementById('ilist');
  if (!items.length) {
    list.innerHTML = '<div class="empty"><em>🎡</em>Nothing on the wheel yet</div>'; return;
  }
  list.innerHTML = items.map((t, i) => `
    <div class="irow">
      <div class="dot" style="background:${PAL[i % PAL.length]}"></div>
      <div class="inum">${i+1}</div>
      <div class="itxt">${esc(t)}</div>
      <button class="xbtn" data-i="${i}" title="Remove">×</button>
    </div>`).join('');
  list.querySelectorAll('.xbtn').forEach(b => b.addEventListener('click', () => del(+b.dataset.i)));
  updateControls();
}

/* ── TABS ────────────────────────────────────────── */
function switchTab(k) {
  ['A','B'].forEach(x => {
    document.getElementById('t'+x).classList.toggle('on', x === k);
    document.getElementById('p'+x).classList.toggle('on', x === k);
  });
}

/* ── THEME ───────────────────────────────────────── */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('stw-theme', t); } catch(e){}
  draw();
}
function toggleTheme() {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}

/* ── KIOSK MODE — for a screen on the street: wheel + spin button only ── */
function setKiosk(on) {
  document.body.classList.toggle('kiosk', on);
  if (on) document.documentElement.requestFullscreen?.().catch(() => {});
  else if (document.fullscreenElement) document.exitFullscreen?.();
  resizeCvs(); draw();
}
function toggleKiosk() { setKiosk(!document.body.classList.contains('kiosk')); }

/* ── EVENTS ──────────────────────────────────────── */
document.getElementById('spinBtn') .addEventListener('click', doSpin);
document.getElementById('addOne')  .addEventListener('click', addOne);
document.getElementById('sin')     .addEventListener('keydown', e => { if (e.key === 'Enter') addOne(); });
document.getElementById('addBulk') .addEventListener('click', addBulk);
document.getElementById('clearAll').addEventListener('click', clearAll);
document.getElementById('contBtn') .addEventListener('click', closeOv);
document.getElementById('spinAgainBtn').addEventListener('click', spinAgain);
document.getElementById('tA')      .addEventListener('click', () => switchTab('A'));
document.getElementById('tB')      .addEventListener('click', () => switchTab('B'));
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('kioskBtn') .addEventListener('click', toggleKiosk);
document.getElementById('displayExit').addEventListener('click', () => setKiosk(false));
document.getElementById('importCancel').addEventListener('click', closeImport);
document.getElementById('importApply').addEventListener('click', () => applyImport(false));
document.getElementById('importAppend').addEventListener('click', () => applyImport(true));
document.getElementById('importOv').addEventListener('keydown', e => {
  if (e.key === 'Escape') closeImport();
  if (e.key === 'Tab') {
    const buttons = [...document.querySelectorAll('#importOv button')].filter(button => !button.hidden);
    const first = buttons[0], last = buttons[buttons.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
document.getElementById('presetSel').addEventListener('change', e => { if (e.target.value) loadPreset(e.target.value); });
document.getElementById('presetSaveBtn').addEventListener('click', saveAsPreset);
document.getElementById('presetDelBtn').addEventListener('click', deletePreset);
document.getElementById('presetExportBtn').addEventListener('click', exportPresets);
document.getElementById('presetImportBtn').addEventListener('click', () => document.getElementById('presetFile').click());
document.getElementById('presetFile').addEventListener('change', e => { if (e.target.files[0]) importPresets(e.target.files[0]); e.target.value = ''; });
document.getElementById('ov')      .addEventListener('click', e => { if (e.target === e.currentTarget) closeOv(); });
window.addEventListener('resize', () => { resizeCvs(); draw(); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('kiosk')) setKiosk(false); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('kiosk'); resizeCvs(); draw(); });

/* ── INIT ────────────────────────────────────────── */
resizeCvs();
try { const s = localStorage.getItem('stw-theme'); if (s === 'dark' || s === 'light') setTheme(s); } catch(e){}
refreshPresetSel();
draw();
render();
</script>
</body>
</html>
